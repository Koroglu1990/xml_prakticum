<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практикум: XML технологии</title>
<style>
  :root {
    --bg: #f4f7f8;
    --panel: #ffffff;
    --text: #202832;
    --text-dim: #5b6772;
    --border: #dfe6ea;
    --brand-dark: #0f3d5c;
    --brand: #0f5c6e;
    --brand-teal: #0f8a8a;
    --brand-light: #eaf4fb;
    --ok-bg: #eaf7ee;
    --ok-border: #2f9e56;
    --ok-text: #1f6e3b;
    --warn-bg: #fff7e6;
    --warn-border: #d1a13a;
    --warn-text: #8a6516;
    --err-bg: #fdeeea;
    --err-border: #d9532c;
    --err-text: #b8401d;
    --code-bg: #1e2733;
    --code-text: #d7e3ea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151a;
      --panel: #171f26;
      --text: #e7edf1;
      --text-dim: #9fb0ba;
      --border: #2a343c;
      --brand-light: #17313f;
      --code-bg: #0d1319;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151a;
    --panel: #171f26;
    --text: #e7edf1;
    --text-dim: #9fb0ba;
    --border: #2a343c;
    --brand-light: #17313f;
    --code-bg: #0d1319;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "DejaVu Sans", sans-serif;
    line-height: 1.55;
    -webkit-user-select: none; user-select: none; /* блокируем выделение везде по умолчанию */
  }
  /* но в текстовых полях студент должен свободно печатать */
  textarea, input { -webkit-user-select: text; user-select: text; }
  p, li, .selectable { -webkit-user-select: text; user-select: text; } /* обычный текст пусть выделяется — это не код */

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, var(--brand-dark), var(--brand));
    color: #fff; padding: 14px 20px calc(14px + env(safe-area-inset-top, 0px)) 20px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .topbar .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }
  .topbar .sub { font-size: 11.5px; opacity: 0.8; margin-top: 2px; }
  .progress-wrap { max-width: 720px; margin: 10px auto 0 auto; }
  .progress-track { background: rgba(255,255,255,0.18); border-radius: 20px; height: 7px; overflow: hidden; }
  .progress-fill { background: #7fe0d6; height: 100%; border-radius: 20px; transition: width .3s ease; }
  .progress-label { font-size: 10.5px; opacity: 0.85; margin-top: 5px; display:flex; justify-content: space-between; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px 16px; }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px; margin-bottom: 16px;
  }
  .tag {
    display:inline-block; background: var(--brand-light); color: var(--brand);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px; margin-bottom: 8px;
  }
  h2 { font-size: 19px; color: var(--brand-dark); margin: 0 0 10px 0; }
  h3 { font-size: 14.5px; color: var(--brand-dark); margin: 16px 0 6px 0; }
  p { margin: 0 0 10px 0; color: var(--text); }
  ul, ol { margin: 0 0 10px 0; padding-left: 20px; }
  li { margin-bottom: 5px; }
  b { color: var(--brand-dark); }
  .btn-tag {
    display:inline-block; background: var(--brand-light); border: 1px solid var(--border);
    color: var(--brand); border-radius: 5px; padding: 1px 7px; font-size: 12.5px; font-weight: 700;
  }
  .kbd {
    display:inline-block; background: #2a333d; color: #e8eef2; border-radius: 5px;
    padding: 1px 7px; font-family: "SFMono-Regular", Menlo, monospace; font-size: 12px;
  }

  .callout { border-radius: 8px; padding: 10px 14px; margin: 12px 0; font-size: 13.5px; }
  .callout .ct { font-weight: 700; display:block; margin-bottom: 3px; }
  .callout.info { background: var(--brand-light); border-left: 4px solid var(--brand); }
  .callout.info .ct { color: var(--brand); }
  .callout.warn { background: var(--warn-bg); border-left: 4px solid var(--warn-border); }
  .callout.warn .ct { color: var(--warn-text); }
  .callout.ok { background: var(--ok-bg); border-left: 4px solid var(--ok-border); }
  .callout.ok .ct { color: var(--ok-text); }

  .step { display: flex; margin-bottom: 12px; gap: 10px; }
  .step .num {
    background: var(--brand-teal); color: #fff; min-width: 24px; height: 24px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size: 12px; flex-shrink:0;
  }
  .step .txt { padding-top: 2px; }

  /* --- защищённый блок кода (не выделяется, копирование блокируется) --- */
  .codebox-label {
    display:inline-block; background: var(--brand-dark); color:#dff3f1; font-family: Menlo, monospace;
    font-size: 11px; padding: 4px 10px; border-radius: 5px 5px 0 0; margin: 10px 0 -6px 0;
  }
  .codebox {
    background: var(--code-bg); color: var(--code-text); font-family: "SFMono-Regular", Menlo, monospace;
    font-size: 12px; border-radius: 8px; padding: 12px 14px; margin: 6px 0 4px 0;
    white-space: pre; overflow-x: auto; line-height: 1.5;
    -webkit-user-select: none !important; user-select: none !important;
    position: relative;
  }
  .codebox::after {
    content: "🔒 нельзя скопировать — впишите ниже сами";
    display: block; font-size: 10px; opacity: 0.55; margin-top: 8px; user-select: none;
  }

  .challenge {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 14px 0; background: var(--bg);
  }
  .challenge textarea {
    width: 100%; min-height: 120px; font-family: "SFMono-Regular", Menlo, monospace; font-size: 12.5px;
    border-radius: 8px; border: 1.5px solid var(--border); background: var(--panel); color: var(--text);
    padding: 10px; resize: vertical; line-height: 1.5; tab-size: 4;
  }
  .challenge textarea:focus { outline: none; border-color: var(--brand-teal); }
  .challenge .row2 { display:flex; gap:8px; align-items:center; margin-top: 8px; flex-wrap: wrap; }
  .check-btn {
    background: var(--brand); color:#fff; border:none; border-radius: 7px; padding: 8px 16px;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .check-btn:hover { background: var(--brand-dark); }
  .result-msg { font-size: 12.5px; font-weight: 600; }
  .result-msg.ok { color: var(--ok-text); }
  .result-msg.err { color: var(--err-text); }
  .done-badge {
    display:inline-block; background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border);
    border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; margin-left: 6px;
  }
  .why-box {
    background: var(--brand-light); border-radius: 8px; padding: 9px 13px; margin: 0 0 4px 0;
    font-size: 12.5px; color: var(--text);
  }
  .nav-row { display:flex; justify-content: space-between; align-items:center; margin-top: 10px; gap: 10px; }
  .nav-btn {
    background: var(--brand-teal); color:#fff; border:none; border-radius: 9px; padding: 12px 20px;
    font-size: 14px; font-weight: 700; cursor: pointer; flex: 1;
  }
  .nav-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }
  .nav-btn.secondary { background: transparent; color: var(--brand); border: 1.5px solid var(--border); flex: 0 0 auto; }

  .toc { display: grid; gap: 6px; margin: 14px 0; }
  .toc-item {
    display:flex; align-items:center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer; background: var(--panel);
  }
  .toc-item.current { border-color: var(--brand-teal); background: var(--brand-light); }
  .toc-item.locked { opacity: 0.5; cursor: not-allowed; }
  .toc-num {
    min-width: 22px; height: 22px; border-radius: 50%; background: var(--border); color: var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size: 11px; font-weight: 700; flex-shrink:0;
  }
  .toc-item.current .toc-num { background: var(--brand-teal); color: #fff; }
  .toc-item.complete .toc-num { background: var(--ok-border); color: #fff; }
  .toc-title { font-size: 13px; }

  footer.pagefoot { text-align:center; color: var(--text-dim); font-size: 11px; padding: 10px 0 30px 0; }

  .reset-link { color: var(--text-dim); font-size: 11px; text-decoration: underline; cursor: pointer; background:none; border:none; padding: 0; }

  /* --- вход по имени --- */
  .gate { max-width: 420px; margin: 60px auto; padding: 0 16px; }
  .gate .card { text-align: center; }
  .gate input {
    width: 100%; padding: 11px 13px; margin: 8px 0; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px;
  }
  .gate input:focus { outline: none; border-color: var(--brand-teal); }
  .gate-btn {
    width: 100%; background: var(--brand-teal); color:#fff; border:none; border-radius: 9px;
    padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .gate-btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }
  .gate-err { color: var(--err-text); font-size: 12px; margin-top: 6px; min-height: 16px; }

  /* --- отчёт для преподавателя --- */
  .report-box {
    background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 12px 14px;
    font-family: "SFMono-Regular", Menlo, monospace; font-size: 12px; white-space: pre-wrap;
    -webkit-user-select: text; user-select: text; margin: 10px 0;
  }
  .copy-btn {
    background: var(--brand-dark); color:#fff; border:none; border-radius: 8px; padding: 10px 18px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }
  .copy-btn.copied { background: var(--ok-border); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10,15,20,0.55); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-card {
    background: var(--panel); border-radius: 12px; padding: 20px; max-width: 460px; width: 100%;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-close {
    float: right; background: none; border: none; font-size: 18px; color: var(--text-dim); cursor: pointer;
  }

  ::selection { background: transparent; }
  textarea::selection, input::selection, p::selection, li::selection { background: #b7d9e8; }

  /* --- дополнения для XML-практикума --- */
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 14px 0; }
  table.t th { text-align: left; background: var(--brand-light); color: var(--brand-dark); padding: 7px 9px; border: 1px solid var(--border); }
  table.t td { padding: 7px 9px; border: 1px solid var(--border); vertical-align: top; background: var(--panel); }
  .codebox .ln {
    display: inline-block; min-width: 2.4em; margin-right: 12px; padding-right: 8px; text-align: right;
    opacity: 0.45; border-right: 1px solid rgba(255,255,255,0.2);
    -webkit-user-select: none; user-select: none;
  }
  .codebox.view::after { content: "🔒 только для чтения — ответ впишите ниже"; }
  .callout b, .callout i { color: inherit; }
</style>
</head>

<div class="topbar">
  <div class="row">
    <div>
      <h1>Практикум: XML технологии</h1>
      <div class="sub" id="subLabel">Правила XML, DTD и обзор технологий — на практике</div>
    </div>
    <div style="text-align:right;">
      <div id="studentLabel" style="font-size:11.5px; color:#dff3f1; margin-bottom:3px;"></div>
      <button class="reset-link" onclick="toggleReportModal(true)" style="color:#dff3f1; margin-right:10px;">Отчёт о прогрессе</button>
      <button class="reset-link" onclick="resetProgress()" style="color:#dff3f1;">Сбросить прогресс</button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label"><span id="progressText">Часть 1 из 17</span><span id="progressPct">0%</span></div>
  </div>
</div>

<div class="wrap" id="app"></div>

<footer class="pagefoot">Код в тёмных блоках нельзя выделить и скопировать — его нужно перепечатать в поле ниже, чтобы двигаться дальше.</footer>

<script>
/* ============================ ЯДРО ПРОВЕРКИ XML / DTD ============================ */
/* Это учебный разборщик: он читает документ так же строго, как настоящий парсер,
   и объясняет ошибки по-русски. Он не заменяет валидатор, а тренирует те же навыки. */

const NAME_RE = /^[\p{L}_:][\p{L}\p{N}._:\-\u00B7]*$/u;
const NMTOKEN_RE = /^[\p{L}\p{N}._:\-\u00B7]+$/u;
const PREDEF_ENT = ["lt", "gt", "amp", "quot", "apos"];

function makeLiner(src) {
  const starts = [0];
  for (let i = 0; i < src.length; i++) if (src.charCodeAt(i) === 10) starts.push(i + 1);
  return function (pos) {
    let lo = 0, hi = starts.length - 1;
    if (pos < 0) pos = 0;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (starts[mid] <= pos) lo = mid; else hi = mid - 1;
    }
    return lo + 1;
  };
}

/* ---------- разбор XML ---------- */
function parseXML(srcRaw) {
  let src = String(srcRaw).replace(/\r\n?/g, "\n");
  if (src.charCodeAt(0) === 0xFEFF) src = src.slice(1);
  const n = src.length;
  const L = makeLiner(src);
  const fail = (pos, msg) => ({ ok: false, line: L(Math.min(pos, n)), msg });
  const isWs = (c) => c === " " || c === "\n" || c === "\t" || c === "\r";
  let i = 0, decl = null, doctype = null;

  // --- XML-декларация ---
  const dm = /^<\?xml(\s[\s\S]*?)?\?>/.exec(src);
  if (dm) {
    const body = dm[1] || "";
    const attrs = {};
    let m; const re = /([A-Za-z]+)\s*=\s*("([^"]*)"|'([^']*)')/g;
    while ((m = re.exec(body))) attrs[m[1]] = m[3] !== undefined ? m[3] : m[4];
    if (!attrs.version) return fail(0, "В XML-декларации обязательно нужен version, например version=\"1.0\"");
    decl = { version: attrs.version, encoding: attrs.encoding || null, standalone: attrs.standalone || null };
    i = dm[0].length;
  } else if (/^\s+<\?xml[\s?]/.test(src)) {
    return fail(src.search(/\S/), "XML-декларация должна быть самой первой строкой файла: перед ней не должно быть пробелов и пустых строк");
  } else if (/^<\?xml/.test(src)) {
    return fail(0, "XML-декларация не закрыта: не хватает ?> в конце");
  }

  // --- пропуск комментариев, инструкций и DOCTYPE ---
  function skipMisc(allowDoctype) {
    for (;;) {
      while (i < n && isWs(src[i])) i++;
      if (src.startsWith("<!--", i)) {
        const e = src.indexOf("-->", i + 4);
        if (e === -1) return fail(i, "Комментарий не закрыт: не хватает -->");
        const body = src.slice(i + 4, e);
        if (body.includes("--")) return fail(i, "Внутри комментария нельзя писать два дефиса подряд");
        i = e + 3;
      } else if (src.startsWith("<?", i)) {
        const e = src.indexOf("?>", i + 2);
        if (e === -1) return fail(i, "Инструкция обработки не закрыта: не хватает ?>");
        const target = /^<\?([^\s?]+)/.exec(src.slice(i, i + 80));
        if (!target || !NAME_RE.test(target[1])) return fail(i, "Неверная инструкция обработки <?…?>");
        if (target[1].toLowerCase() === "xml") return fail(i, "Декларация <?xml …?> допустима только в самом начале документа");
        i = e + 2;
      } else if (allowDoctype && src.startsWith("<!DOCTYPE", i)) {
        if (doctype) return fail(i, "DOCTYPE можно указать только один раз");
        const start = i;
        const nm = /<!DOCTYPE\s+([^\s\[>]+)/y; nm.lastIndex = i;
        const m = nm.exec(src);
        if (!m) return fail(i, "После DOCTYPE нужно указать имя корневого элемента");
        let p = i + m[0].length;
        const dt = { name: m[1], system: null, publicId: null, subset: null, subsetStart: 0 };
        while (p < n && isWs(src[p])) p++;
        let mm;
        const sys = /SYSTEM\s+("([^"]*)"|'([^']*)')/y; sys.lastIndex = p;
        const pub = /PUBLIC\s+("([^"]*)"|'([^']*)')(\s+("([^"]*)"|'([^']*)'))?/y; pub.lastIndex = p;
        if ((mm = sys.exec(src))) { dt.system = mm[2] !== undefined ? mm[2] : mm[3]; p += mm[0].length; }
        else if ((mm = pub.exec(src))) {
          dt.publicId = mm[2] !== undefined ? mm[2] : mm[3];
          dt.system = mm[6] !== undefined ? mm[6] : (mm[7] !== undefined ? mm[7] : null);
          p += mm[0].length;
        }
        while (p < n && isWs(src[p])) p++;
        if (src[p] === "[") {
          let k = p + 1; dt.subsetStart = k;
          for (;;) {
            if (k >= n) return fail(start, "В DOCTYPE не закрыта квадратная скобка: не хватает ]");
            const c = src[k];
            if (c === '"' || c === "'") { const e = src.indexOf(c, k + 1); if (e === -1) return fail(k, "В DTD не закрыта кавычка"); k = e + 1; continue; }
            if (src.startsWith("<!--", k)) { const e = src.indexOf("-->", k + 4); if (e === -1) return fail(k, "В DTD не закрыт комментарий"); k = e + 3; continue; }
            if (c === "]") break;
            k++;
          }
          dt.subset = src.slice(p + 1, k);
          dt.subsetLine = L(p + 1);
          p = k + 1;
          while (p < n && isWs(src[p])) p++;
        }
        if (src[p] !== ">") return fail(p, "Объявление DOCTYPE должно заканчиваться символом >");
        doctype = dt;
        i = p + 1;
      } else break;
    }
    return null;
  }
  let err = skipMisc(true);
  if (err) return err;

  // --- дерево элементов ---
  const stack = [];
  const scopes = [{ xml: "http://www.w3.org/XML/1998/namespace" }];
  let root = null;
  const top = () => stack[stack.length - 1];

  while (i < n) {
    if (src[i] !== "<") {
      const j = src.indexOf("<", i);
      const end = j === -1 ? n : j;
      const text = src.slice(i, end);
      if (stack.length === 0) {
        if (/\S/.test(text)) return fail(i + text.search(/\S/), root ? "После корневого элемента не должно быть текста" : "Текст находится вне корневого элемента");
      } else {
        const bad = /&(?!(?:[\p{L}_:][\p{L}\p{N}._:\-]*|#[0-9]+|#x[0-9a-fA-F]+);)/u.exec(text);
        if (bad) return fail(i + bad.index, "Символ & в тексте нужно писать как &amp; (или это должна быть ссылка на сущность вида &имя;)");
        if (text.includes("]]>")) return fail(i + text.indexOf("]]>"), "Последовательность ]]> нельзя использовать в обычном тексте");
        top().children.push({ type: "text", value: text, line: L(i) });
      }
      i = end;
      continue;
    }
    if (src.startsWith("<!--", i)) {
      const e = src.indexOf("-->", i + 4);
      if (e === -1) return fail(i, "Комментарий не закрыт: не хватает -->");
      const body = src.slice(i + 4, e);
      if (body.includes("--")) return fail(i, "Внутри комментария нельзя писать два дефиса подряд");
      if (stack.length) top().children.push({ type: "comment", value: body, line: L(i) });
      i = e + 3;
      continue;
    }
    if (src.startsWith("<![CDATA[", i)) {
      if (!stack.length) return fail(i, "Секция CDATA допустима только внутри элемента");
      const e = src.indexOf("]]>", i + 9);
      if (e === -1) return fail(i, "Секция CDATA не закрыта: не хватает ]]>");
      top().children.push({ type: "cdata", value: src.slice(i + 9, e), line: L(i) });
      i = e + 3;
      continue;
    }
    if (src.startsWith("<?", i)) {
      err = null;
      const e = src.indexOf("?>", i + 2);
      if (e === -1) return fail(i, "Инструкция обработки не закрыта: не хватает ?>");
      const target = /^<\?([^\s?]+)/.exec(src.slice(i, i + 80));
      if (target && target[1].toLowerCase() === "xml") return fail(i, "Декларация <?xml …?> допустима только в самом начале документа");
      i = e + 2;
      continue;
    }
    if (src.startsWith("<!", i)) {

    Для проверки грамматики документа и нужен <b>DTD</b> (Document Type Definition). Он описывает: какие элементы допустимы, сколько их,
    какие у них атрибуты, обязательны ли они, и какие есть сущности.</p>

/* ============================ СОСТОЯНИЕ ============================ */
const STORAGE_KEY = "ithub-xml-practicum-progress-v1";
let state = { current: 0, solved: {}, student: null, autoSubmitted: false, timings: {}, attempts: {}, suspicious: {} };

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { /* нет доступа к storage — работаем в памяти */ }
  if (!state.timings) state.timings = {};
  if (!state.attempts) state.attempts = {};
  if (!state.suspicious) state.suspicious = {};
  if (!state.solved) state.solved = {};
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function resetProgress() {
  if (!confirm("Сбросить весь прогресс? Имя и группу нужно будет ввести заново.")) return;
  state = { current: 0, solved: {}, student: null, autoSubmitted: false, timings: {}, attempts: {}, suspicious: {} };
  saveState();
  render();
}

/* ============================ ЗАДАНИЯ ЧАСТИ ============================ */
// Три группы заданий в части: challenges, challenges2, challenges3 (между ними — after, after2, after3)
const GROUPS = [
  { list: "challenges", tag: "", after: "after" },
  { list: "challenges2", tag: "b", after: "after2" },
  { list: "challenges3", tag: "c", after: "after3" }
];
function keyOf(partId, tag, i) { return tag ? `${partId}:${tag}${i}` : `${partId}:${i}`; }
function getChallenge(partId, idx) {
  const part = PARTS.find(p => p.id === partId);
  if (typeof idx === "string") {
    const g = GROUPS.find(x => x.tag && idx.startsWith(x.tag));
    return part[g.list][parseInt(idx.slice(1), 10)];
  }
  return part.challenges[idx];
}
function isPartComplete(part) {
  for (const g of GROUPS) {
    const list = part[g.list] || [];
    for (let i = 0; i < list.length; i++) if (!state.solved[keyOf(part.id, g.tag, i)]) return false;
  }
  return true;
}

function renderGate(err) {

  document.getElementById("studentLabel").textContent = "";

    <div class="gate">
      <div class="card">
        <h2 style="margin-top:0;">Прежде чем начать</h2>

  render();
}

   └──────────────────────────────────────────────────────────────────────────┘ */
const GOOGLE_FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSeBxvkbv3ENkWAIhmPoSXbXGfQCLAsIZiOtVoOAZ2KVxJgeew/formResponse";
const GOOGLE_FORM_ENTRIES = {
  name: "entry.297974728",
  group: "entry.1154430205",
  status: "entry.1998334715",
  tasks: "entry.1082785340"
};
const EXPECTED_HOST = "koroglu1990.github.io";
function sourceIsTrusted() {
  return location.hostname === EXPECTED_HOST;
}
function formConfigured() {
  return /^https:\/\/docs\.google\.com\/forms\/d\/e\/[A-Za-z0-9_-]+\/formResponse$/.test(GOOGLE_FORM_ACTION) &&
    Object.values(GOOGLE_FORM_ENTRIES).every(v => /^entry\.\d+$/.test(v)) &&
    !Object.values(GOOGLE_FORM_ENTRIES).some(v => /^entry\.0+\d$/.test(v));
}
function collectWorkStats() {
  let totalSeconds = 0, totalAttempts = 0;
  const suspiciousFiles = [];
  PARTS.forEach(p => {
    GROUPS.forEach(g => (p[g.list] || []).forEach((ch, i) => {
      const key = keyOf(p.id, g.tag, i);
      if (state.solved[key]) {
        totalSeconds += (state.timings[key] && state.timings[key].elapsedSeconds) || 0;
        totalAttempts += state.attempts[key] || 0;
        if (state.suspicious[key]) suspiciousFiles.push(ch.filename || `часть ${p.id}, ответ ${i + 1}`);
      }
    }));
  });
  return { totalSeconds, totalAttempts, suspiciousFiles };
}
function reportFields() {
  const total = PARTS.length;
  let solvedCount = 0, totalChallenges = 0;
  PARTS.forEach(p => {
    GROUPS.forEach(g => (p[g.list] || []).forEach((_, i) => { totalChallenges++; if (state.solved[keyOf(p.id, g.tag, i)]) solvedCount++; }));
  });
  const finished = state.current === total - 1 && isPartComplete(PARTS[total - 1]);
  let status = finished ? "Практикум «XML технологии»: пройден полностью" : `Практикум «XML технологии»: дошёл до части ${state.current + 1} из ${total}`;
  const work = collectWorkStats();
  status += ` | время работы: ${formatDuration(work.totalSeconds)} | ошибочных попыток: ${work.totalAttempts}`;
  if (work.suspiciousFiles.length > 0) {
    status += ` | ⚠ возможна вставка в: ${work.suspiciousFiles.join(", ")}`;
  }
  if (!integrityOk()) {
    status += ` | ⚠⚠ код проверки был изменён через консоль браузера`;
  }
  if (!sourceIsTrusted()) {
    status = `⚠ ИЗМЕНЁННАЯ КОПИЯ (открыто с ${location.hostname || "локального файла"}) — ` + status;
  }
  return { name: state.student.name, group: state.student.group, status, tasks: `${solvedCount} из ${totalChallenges}` };
}
function submitToGoogleForm() {
  if (!state.student || !formConfigured()) return false;
  const fields = reportFields();
  const iframeName = "gform-submit-frame";
  let iframe = document.getElementById(iframeName);
  if (!iframe) {
    iframe = document.createElement("iframe");
    iframe.name = iframeName;
    iframe.id = iframeName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);
  }
  const form = document.createElement("form");
  form.action = GOOGLE_FORM_ACTION;
  form.method = "POST";
  form.target = iframeName;
  form.style.display = "none";
  Object.keys(GOOGLE_FORM_ENTRIES).forEach(key => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = GOOGLE_FORM_ENTRIES[key];
    input.value = fields[key];
    form.appendChild(input);
  });
  document.body.appendChild(form);
  form.submit();
  setTimeout(() => form.remove(), 1500);
  return true;
}
function sendReport(btnId) {
  const sent = submitToGoogleForm();
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.textContent = sent ? "✓ Отправлено преподавателю" : "Форма не настроена — нажмите «Скопировать текстом»";
    if (sent) btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Отправить преподавателю"; btn.classList.remove("copied"); }, 3500);
  }
}

/* ============================ ОТЧЁТ (ТЕКСТ, РЕЗЕРВНЫЙ СПОСОБ) ============================ */
function buildReport() {
  const f = reportFields();
  const work = collectWorkStats();
  const dtStr = new Date().toLocaleString("ru-RU");
  let text = `Отчёт о выполнении практикума «XML технологии»
Студент: ${f.name}
Группа: ${f.group}
Дата: ${dtStr}
Статус: ${f.status.split(" | ")[0]}
Заданий решено: ${f.tasks}
Суммарное время работы над заданиями: ${formatDuration(work.totalSeconds)}
Ошибочных попыток проверки: ${work.totalAttempts}`;
  if (work.suspiciousFiles.length > 0) {
    text += `\n⚠ Похоже на вставку текста, а не печать, в заданиях: ${work.suspiciousFiles.join(", ")}`;
  }
  if (!integrityOk()) {
    text += `\n⚠⚠ Обнаружено изменение кода проверки через консоль браузера в этой сессии`;
  }
  return text;
}
function copyReport(btnId) {
  const text = buildReport();
  const btn = document.getElementById(btnId || "copyReportBtn");
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✓ Скопировано";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Скопировать текстом (запасной способ)"; btn.classList.remove("copied"); }, 2500);
  }).catch(() => {
    btn.textContent = "Не получилось — выделите текст выше вручную";
  });
}

/* ============================ ПРОВЕРКА ЗАДАНИЙ ============================ */
let keydownCounts = {}; // в памяти, не сохраняется — намеренно: перезагрузка = заново печатать
function bumpKeydown(key, e) {
  keydownCounts[key] = (keydownCounts[key] || 0) + 1;
  // Tab в поле кода вставляет два пробела, а не уводит курсор из поля
  if (e && e.key === "Tab" && e.target && e.target.tagName === "TEXTAREA" && !e.target.readOnly) {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
}

function checkChallenge(partId, idx) {
  const key = `${partId}:${idx}`;
  const ta = document.getElementById(`ta-${partId}-${idx}`);
  const msg = document.getElementById(`msg-${partId}-${idx}`);
  const ch = getChallenge(partId, idx);
  const raw = ta.value;

  let res;
  if (ch.calc) res = checkCalc(ch, raw);
  else if (ch.compose) res = COMPOSE_CHECKERS[ch.compose](raw);
  else res = checkTyped(ch, raw);

  if (res.ok) {
    state.solved[key] = true;
    const startedAt = state.timings[key] ? state.timings[key].startedAt : Date.now();
    const elapsedSeconds = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
    const kd = keydownCounts[key] || 0;
    state.timings[key] = { startedAt, elapsedSeconds };
    state.suspicious[key] = raw.length > 15 && kd < raw.length * 0.3;
    if (ch.compose) { if (!state.composeText) state.composeText = {}; state.composeText[key] = raw; }
    saveState();
    msg.className = "result-msg ok";
    msg.textContent = ch.calc ? "✓ Верно! Можно двигаться дальше." : (ch.compose ? "✓ Всё сходится с описанием! Отлично." : "✓ Совпадает! Можно двигаться дальше.");
    render();
  } else {
    state.attempts[key] = (state.attempts[key] || 0) + 1;
    saveState();
    msg.className = "result-msg err";
    msg.textContent = res.msg || "✗ Пока не совпадает.";
  }
}

/* ============================ РЕНДЕР ============================ */
function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function codeBoxHtml(label, code, viewOnly) {
  const lines = String(code).split("\n");
  const body = lines.map((l, i) => `<span class="ln">${i + 1}</span>${escapeHtml(l)}`).join("\n");
  return `${label ? `<span class="codebox-label">${escapeHtml(label)}</span>` : ""}<div class="codebox${viewOnly ? " view" : ""}" oncopy="return false" oncontextmenu="return false" onselectstart="return false" ondragstart="return false">${body}</div>`;
}
function formatDuration(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return m > 0 ? `${m} мин ${s} сек` : `${s} сек`;
}
function doneBadge(key) {
  const t = state.timings[key];
  return `<span class="done-badge">✓ Сделано${t && t.elapsedSeconds ? ` · ${formatDuration(t.elapsedSeconds)}` : ""}${state.attempts[key] ? ` · попыток: ${state.attempts[key] + 1}` : ""}${state.suspicious[key] ? ` · <span style="color:var(--err-text);">возможна вставка</span>` : ""}</span>`;
}
function renderChallenge(part, ch, i, tag) {
  const idx = tag ? `${tag}${i}` : i;
  const key = keyOf(part.id, tag, i);
  const taId = `ta-${part.id}-${idx}`;
  const msgId = `msg-${part.id}-${idx}`;
  const solved = !!state.solved[key];
  if (!solved && !state.timings[key]) {
    state.timings[key] = { startedAt: Date.now() };
    saveState();
  }
  const idxArg = typeof idx === "string" ? `'${idx}'` : idx;
  const guards = `onpaste="return false" ondrop="return false" oncontextmenu="return false" onkeydown="bumpKeydown('${key}', event)"`;
  const actions = `
    <div class="row2">
      ${solved ? doneBadge(key) : `<button class="check-btn" onclick="checkChallenge(${part.id}, ${idxArg})">Проверить</button><span class="result-msg" id="${msgId}"></span>`}
    </div>`;
  const why = ch.why ? `<p class="why-box">🎯 ${escapeHtml(ch.why)}</p>` : "";
  const note = ch.note ? `<p style="font-size:12px;color:var(--text-dim);margin-top:6px;">💡 ${escapeHtml(ch.note)}</p>` : "";

  if (ch.calc) {
    const answerValue = solved ? escapeHtml(String(ch.answers ? ch.answers[0] : ch.answer)) : "";
    return `
      <div class="challenge">
        ${why}
        ${ch.view ? codeBoxHtml(ch.viewName || "", ch.view, true) : ""}
        <p style="font-weight:600; color:var(--brand-dark); margin:8px 0;">${escapeHtml(ch.question)}</p>
        ${ch.note ? `<p style="font-size:12px;color:var(--text-dim);margin-top:-4px;margin-bottom:8px;">💡 ${escapeHtml(ch.note)}</p>` : ""}
        <input type="text" id="${taId}" placeholder="Впишите ответ..." style="width:100%; padding:10px 12px; font-family:'SFMono-Regular',Menlo,monospace; font-size:14px; border-radius:8px; border:1.5px solid var(--border); background:var(--panel); color:var(--text);" onpaste="return false" ondrop="return false" oncontextmenu="return false" onkeydown="bumpKeydown('${key}', event)" ${solved ? "readonly" : ""} value="${answerValue}">
        ${actions}
      </div>`;
  }
  if (ch.compose) {
    return `
      <div class="challenge">
        ${why}
        <p style="font-weight:600; color:var(--brand-dark); margin:8px 0;">${escapeHtml(ch.question)}</p>
        ${note}
        <textarea id="${taId}" spellcheck="false" autocomplete="off" autocapitalize="off" style="min-height:${(ch.rows || 12) * 19}px" placeholder="${escapeHtml(ch.placeholder || "")}" ${guards} ${solved ? "readonly" : ""}>${solved ? escapeHtml(state.composeText && state.composeText[key] || "✓ принято") : ""}</textarea>
        ${actions}
      </div>`;
  }
  const shownCode = ch.shown || ch.code;
  return `
    <div class="challenge">
      ${why}
      ${codeBoxHtml(ch.filename, shownCode)}
      ${note}
      <textarea id="${taId}" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Впишите код сюда вручную..." ${guards} ${solved ? "readonly" : ""}>${solved ? escapeHtml(ch.code) : ""}</textarea>
      ${actions}
    </div>`;
}

function render() {
  if (!state.student) { renderGate(); return; }
  document.getElementById("studentLabel").textContent = `${state.student.name} · ${state.student.group}`;
  const part = PARTS[state.current];
  const app = document.getElementById("app");
  const total = PARTS.length;
  const complete = isPartComplete(part);

  let bodyHtml = "";
  GROUPS.forEach(g => {
    const list = part[g.list] || [];
    bodyHtml += list.map((ch, i) => renderChallenge(part, ch, i, g.tag)).join("");
    bodyHtml += part[g.after] || "";
  });

  const reportHtml = part.final ? `
    <h3>Отчёт для преподавателя</h3>
    <p>Отправьте отчёт преподавателю — это подтверждение, что практикум пройден.</p>
    <div class="report-box selectable">${escapeHtml(buildReport())}</div>
    <button class="copy-btn" id="sendReportBtn" onclick="sendReport('sendReportBtn')">Отправить преподавателю</button>
    <button class="copy-btn" id="copyReportBtn" onclick="copyReport()" style="background:transparent;color:var(--brand);border:1.5px solid var(--border);">Скопировать текстом (запасной способ)</button>
    <p style="font-size:11px;color:var(--text-dim);margin-top:8px;">При переходе на эту страницу отчёт отправляется автоматически. Кнопка нужна, если хотите отправить ещё раз или что-то пошло не так.</p>
  ` : "";

  app.innerHTML = `
    <div class="card">
      <span class="tag">${escapeHtml(part.tag)}</span>
      <h2>${escapeHtml(part.title)}</h2>
      ${part.html}
      ${bodyHtml}
      ${reportHtml}
      <div class="nav-row">
        <button class="nav-btn secondary" onclick="goPrev()" ${state.current === 0 ? "disabled" : ""}>← Назад</button>
        <button class="nav-btn" onclick="goNext()" ${(!complete || state.current === total - 1) ? "disabled" : ""}>
          ${state.current === total - 1 ? "Это финал" : (complete ? "Далее →" : "Выполните задания выше, чтобы продолжить")}
        </button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">Содержание</h3>
      <div class="toc">
        ${PARTS.map((p, i) => {
          const done = isPartComplete(p) && i < state.current;
          const cls = i === state.current ? "current" : (done ? "complete" : (i > state.current && !allPriorComplete(i) ? "locked" : ""));
          return `<div class="toc-item ${cls}" onclick="${(i <= state.current || allPriorComplete(i)) ? `goTo(${i})` : ''}">
            <span class="toc-num">${done ? "✓" : i + 1}</span>
            <span class="toc-title">${escapeHtml(p.title)}</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  `;

  const pct = Math.round((state.current / (total - 1)) * 100);
  document.getElementById("progressFill").style.width = `${pct}%`;
  document.getElementById("progressText").textContent = `Часть ${state.current + 1} из ${total}`;
  document.getElementById("progressPct").textContent = `${pct}%`;
  window.scrollTo({ top: 0, behavior: "instant" });
}

function allPriorComplete(i) {
  for (let k = 0; k < i; k++) if (!isPartComplete(PARTS[k])) return false;
  return true;
}
function goNext() {
  if (!isPartComplete(PARTS[state.current])) return;
  if (state.current < PARTS.length - 1) {
    state.current++;
    if (state.current === PARTS.length - 1 && !state.autoSubmitted) {
      if (submitToGoogleForm()) state.autoSubmitted = true;
    }
    saveState();
    render();
  }
}
function goPrev() {
  if (state.current > 0) { state.current--; saveState(); render(); }
}
function goTo(i) {
  if (i <= state.current || allPriorComplete(i)) { state.current = i; saveState(); render(); }
}

/* ============================ ЗАЩИТА ОТ КОПИРОВАНИЯ ============================ */
document.addEventListener("copy", function (e) {
  const active = document.activeElement;
  if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return; // в полях ввода копировать можно
  e.preventDefault();
});
document.addEventListener("contextmenu", function (e) {
  const active = document.activeElement;
  if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) return;
  e.preventDefault();
});
document.addEventListener("keydown", function (e) {
  const active = document.activeElement;
  const inField = active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT");
  const key = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && (key === "c" || key === "u") && !inField) {
    e.preventDefault();
  }
  if ((e.ctrlKey || e.metaKey) && key === "s") { e.preventDefault(); }
});

/* ============================ ПРОВЕРКА ЦЕЛОСТНОСТИ КОДА ============================ */
// Если студент через консоль браузера подменит функции проверки (например, попросив
// нейросеть «напиши код, чтобы задание засчитывалось без проверки»), их исходный
// текст изменится — это и обнаруживаем.
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
  return h;
}
function integritySnapshot() {
  try {
    return simpleHash(checkChallenge.toString() + checkCalc.toString() + checkTyped.toString() +
      checkShopDtd.toString() + checkShopXml.toString() + sourceIsTrusted.toString());
  } catch (e) { return null; }
}
const INTEGRITY_BASELINE = integritySnapshot();
function integrityOk() {
  const current = integritySnapshot();
  return current === null || current === INTEGRITY_BASELINE;
}

/* ============================ СТАРТ ============================ */
loadState();
if (state.current >= PARTS.length) state.current = 0;
render();

</script>
</body>
</html>
